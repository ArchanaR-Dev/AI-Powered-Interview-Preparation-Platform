<div class="form-wrapper">
  <h2>Create Your Account</h2>
  <p class="subtitle">Join the platform and start acing your interviews with AI-powered practice.</p>

  <form (ngSubmit)="registerUser()">
    <div>
      <label for="name">Name <span class="required">*</span></label>
      <input type="text" id="name" name="name" [(ngModel)]="user.name" required>
    </div>
    <div>
      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" name="email" [(ngModel)]="user.email" required>
    </div>
    <div>
      <label for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" [(ngModel)]="user.password" required>
    </div>
    <button type="submit">Register</button>
  </form>
  <p class="message" *ngIf="message">{{ message }}</p>

   <p class="switch-link">
    Already have an account? <a routerLink="">Log In</a>
  </p>
</div>
